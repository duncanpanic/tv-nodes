name: subs-check

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOK: ${{ secrets.GITHUB_TOKEN }}
      FALLBACK_VER: v1.6.5
    steps:
      - uses: actions/checkout@v4

      - name: Download subs-check
        run: |
          set -e
          REL=$(curl -s -H "Authorization: Bearer $GH_TOK" https://api.github.com/repos/beck-8/subs-check/releases/latest)
          VER=$(echo "$REL" | jq -r '.tag_name // empty')
          ASSET=$(echo "$REL" | jq -r '.assets[]? | select(.name|test("Linux_x86_64\\.tar\\.gz")) | .browser_download_url' | head -1)
          if [ -z "$ASSET" ] || [ "$ASSET" = "null" ]; then
            ASSET="https://github.com/beck-8/subs-check/releases/download/${VER:-$FALLBACK_VER}/subs-check_Linux_x86_64.tar.gz"
          fi
          echo "version=$VER asset=$ASSET"
          curl -sSL --retry 3 -o sc.tar.gz "$ASSET"
          tar xzf sc.tar.gz
          BIN=$(find . -path ./.github -prune -o -type f -name 'subs-check' -print | head -1)
          chmod +x "$BIN"
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Download mihomo core (for subs-check internal use)
        run: |
          set -e
          REL=$(curl -s -H "Authorization: Bearer $GH_TOK" https://api.github.com/repos/MetaCubeX/mihomo/releases/latest)
          VER=$(echo "$REL" | jq -r '.tag_name // empty')
          NAME=$(echo "$REL" | jq -r --arg b "mihomo-linux-amd64-v1" '.assets[]?.name | select(test("^" + $b + "-v.*\\.gz$"))' | head -1)
          if [ -z "$NAME" ] || [ "$NAME" = "null" ]; then
            VER=${VER:-v1.19.34}
            NAME="mihomo-linux-amd64-v1-v${VER}.gz"
          fi
          ASSET="https://github.com/MetaCubeX/mihomo/releases/download/${VER}/${NAME}"
          echo "mihomo version=$VER asset=$ASSET"
          curl -sSL --retry 3 -o mihomo.gz "$ASSET"
          gunzip -c mihomo.gz > mihomo
          chmod +x mihomo
          echo "MIHOMO_BIN=$PWD/mihomo" >> "$GITHUB_ENV"

      - name: Debug - Show runner network info
        run: |
          echo "=== Runner IP ==="
          curl -s http://ip-api.com/json/ || true
          echo ""
          echo "=== DNS Resolution Test ==="
          for h in gstatic.com cloudflare.com github.com; do
            echo -n "$h: "
            dig +short $h A | head -1 || echo "FAIL"
          done
          echo ""
          echo "=== TCP Connect Test (gstatic.com:80) ==="
          timeout 5 bash -c "cat < /dev/null > /dev/tcp/gstatic.com/80" && echo "OK" || echo "FAIL"
          echo ""
          echo "=== Runner Environment ==="
          uname -a
          free -h
          df -h /

      - name: Create subs-check config with connectivity test
        run: |
          cat > config.yaml <<'EOF'
print-progress: true
concurrent: 50
media-concurrent: 20
speed-concurrent: 20
shuffle-test-order: true
check-interval: 1440
success-limit: 0
timeout: 8000
alive-test-url: http://cp.cloudflare.com/generate_204
speed-test-url: https://github.com/AaronFeng753/Waifu2x-Extension-GUI/releases/download/v2.21.12/Waifu2x-Extension-GUI-v2.21.12-Portable.7z
min-speed: 512
download-timeout: 15
download-mb: 20
total-speed-limit: 0
listen-port: ":8199"
rename-node: true
node-prefix: ""
media-check: true
media-check-timeout: 10
platforms:
  - iprisk
  - youtube
  - netflix
  - disney
keep-days: 7
output-dir: "output"
enable-web-ui: false
save-method: local
sub-urls:
  - "https://raw.githubusercontent.com/firefoxmmx2/v2rayshare_subcription/main/subscription/clash_sub.yaml"
  - "https://raw.githubusercontent.com/Q3dlaXpoaQ/V2rayN_Clash_Node_Getter/refs/heads/main/APIs/sc0.yaml"
  - "https://raw.githubusercontent.com/mahdibland/SSAggregator/master/sub/sub_merge_yaml.yml"
  - "https://raw.githubusercontent.com/chengaopan/AutoMergePublicNodes/master/list.yml"
  - "https://raw.githubusercontent.com/zhangkaiitugithub/passcro/main/speednodes.yaml"
  - "https://raw.githubusercontent.com/aiboboxx/v2rayfree/refs/heads/main/README.md"
  - "https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/snippets/nodes.meta.yml"
  - "https://raw.githubusercontent.com/Ruk1ng001/freeSub/main/clash.yaml"
  - "https://raw.githubusercontent.com/SoliSpirit/v2ray-configs/main/all_configs.txt"
  - "https://raw.githubusercontent.com/ripaojiedian/freenode/main/clash"
  - "https://raw.githubusercontent.com/go4sharing/sub/main/sub.yaml"
  - "https://raw.githubusercontent.com/actionsfz/v2ray/refs/heads/master/all.yaml"
  - "https://raw.githubusercontent.com/Pawdroid/Free-servers/refs/heads/main/sub"
  - "https://raw.githubusercontent.com/acymz/AutoVPN/main/data/V2.txt"
  - "https://raw.githubusercontent.com/Barabama/FreeNodes/main/nodes/wenode.txt"
  - "https://raw.githubusercontent.com/Barabama/FreeNodes/main/nodes/v2rayshare.txt"
  - "https://raw.githubusercontent.com/Barabama/FreeNodes/main/nodes/nodefree.txt"
  - "https://raw.githubusercontent.com/Barabama/FreeNodes/main/nodes/ndnode.txt"
  - "https://raw.githubusercontent.com/Barabama/FreeNodes/main/nodes/clashmeta.txt"
  - "https://raw.githubusercontent.com/xiaoji235/airport-free/main/v2ray.txt"
EOF

      - name: Run subs-check one round
        run: |
          "$BIN" -f config.yaml > sc.log 2>&1 &
          PID=$!; DONE=0
          for i in $(seq 1 360); do
            sleep 10
            if grep -qE "检测完成" sc.log; then DONE=1; echo "done in ~$((i*10))s"; break; fi
            if ! kill -0 $PID 2>/dev/null; then DONE=1; echo "exited"; break; fi
          done
          [ "$DONE" = "0" ] && echo "timeout, force stop"
          sleep 8; kill $PID 2>/dev/null || true
          grep -E "合并去重后节点数量|存活节点数量|流媒体检测通过|可用节点数量|消耗流量" sc.log | tail -20 || true
          grep -iE "level=FATAL|level=ERROR" sc.log | tail -8 || true
          ls -la output/ 2>/dev/null || true

      - name: Enrich + grade -> nodes.json
        run: |
          python3 -m pip install -q pyyaml 2>/dev/null || true
          python3 enrich.py

      - name: Commit results
        run: |
          set -e
          git config user.name "node-bot"; git config user.email "bot@localhost"
          git add nodes.json top10.yaml 2>/dev/null || true
          git commit -q -m "auto update $(date -u +%F\ %R)UTC" || echo "no change"
          for i in 1 2 3; do
            git pull --rebase --autostash -q origin main || true
            if git push -q origin HEAD:main; then echo pushed; break; fi
            echo "push retry $i"; sleep 5
          done
          wc -c nodes.json top10.yaml 2>/dev/null || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nodes-run
          path: output/
          retention-days: 3
          if-no-files-found: ignore