name: subs-check

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOK: ${{ secrets.GITHUB_TOKEN }}
      FALLBACK_VER: v1.6.5
    steps:
      - uses: actions/checkout@v4

      - name: Download subs-check
        run: |
          set -e
          REL=$(curl -s -H "Authorization: Bearer $GH_TOK" https://api.github.com/repos/beck-8/subs-check/releases/latest)
          VER=$(echo "$REL" | jq -r '.tag_name // empty')
          ASSET=$(echo "$REL" | jq -r '.assets[]? | select(.name|test("Linux_x86_64\\.tar\\.gz")) | .browser_download_url' | head -1)
          if [ -z "$ASSET" ] || [ "$ASSET" = "null" ]; then
            ASSET="https://github.com/beck-8/subs-check/releases/download/${VER:-$FALLBACK_VER}/subs-check_Linux_x86_64.tar.gz"
          fi
          echo "version=$VER asset=$ASSET"
          curl -sSL --retry 3 -o sc.tar.gz "$ASSET"
          tar xzf sc.tar.gz
          BIN=$(find . -path ./.github -prune -o -type f -name 'subs-check' -print | head -1)
          chmod +x "$BIN"
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Download mihomo core
        run: |
          set -e
          REL=$(curl -s -H "Authorization: Bearer $GH_TOK" https://api.github.com/repos/MetaCubeX/mihomo/releases/latest)
          VER=$(echo "$REL" | jq -r '.tag_name // empty')
          ASSET=$(echo "$REL" | jq -r '.assets[]? | select(.name|test("linux-amd64-v3\\.gz$")) | .browser_download_url' | head -1)
          if [ -z "$ASSET" ] || [ "$ASSET" = "null" ]; then
            VER=${VER:-v1.19.8}
            ASSET="https://github.com/MetaCubeX/mihomo/releases/download/${VER}/mihomo-linux-amd64-v3.gz"
          fi
          echo "mihomo version=$VER asset=$ASSET"
          curl -sSL --retry 3 -o mihomo.gz "$ASSET"
          gunzip -c mihomo.gz > mihomo
          chmod +x mihomo
          echo "MIHOMO_BIN=$PWD/mihomo" >> "$GITHUB_ENV"

      - name: Run subs-check one round
        run: |
          "$BIN" -f config.yaml > sc.log 2>&1 &
          PID=$!; DONE=0
          for i in $(seq 1 290); do
            sleep 10
            if grep -qE "检测完成" sc.log; then DONE=1; echo "done in ~$((i*10))s"; break; fi
            if ! kill -0 $PID 2>/dev/null; then DONE=1; echo "exited"; break; fi
          done
          [ "$DONE" = "0" ] && echo "timeout, force stop"
          sleep 8; kill $PID 2>/dev/null || true
          grep -E "合并去重后节点数量|存活节点数量|流媒体检测通过|可用节点数量|消耗流量" sc.log | tail -20 || true
          grep -iE "level=FATAL|level=ERROR" sc.log | tail -8 || true
          ls -la output/ 2>/dev/null || true

      - name: Connectivity test (TCP + HTTP via mihomo)
        run: |
          python3 - <<'PY'
          import glob, json, re, sys, subprocess, os, urllib.request, urllib.parse, concurrent.futures as cf, time
          
          def load_yaml(path):
              try:
                  import yaml
                  return yaml.safe_load(open(path, encoding="utf-8")) or {}
              except ImportError:
                  return None
          
          def parse_clash(path):
              proxies, cur = [], None
              for line in open(path, encoding="utf-8", errors="replace"):
                  if line.strip().startswith("- ") and "type:" in line:
                      if cur: proxies.append(cur)
                      cur = {}; body = line.strip()[2:]
                      mm = re.match(r"([A-Za-z0-9_-]+):\s*(.*)$", body)
                      if mm: cur[mm.group(1)] = mm.group(2).strip().strip('"')
                      continue
                  if cur is not None and line.startswith("      "):
                      mm = re.match(r"\s*([A-Za-z0-9_-]+):\s*(.*)$", line)
                      if mm: cur[mm.group(1)] = mm.group(2).strip().strip('"')
              if cur: proxies.append(cur)
              return {"proxies": proxies}
          
          def main():
              files = glob.glob("output/*.yaml") + glob.glob("output/*.yml")
              if not files:
                  print("no output files"); sys.exit(0)
              proxies = []
              for f in files:
                  d = load_yaml(f)
                  if d is None: d = parse_clash(f)
                  proxies += d.get("proxies") or []
              print(f"loaded {len(proxies)} proxies from {len(files)} files")
              
              mihomo_bin = os.environ.get("MIHOMO_BIN")
              if not mihomo_bin or not os.path.exists(mihomo_bin):
                  print(f"MIHOMO_BIN not set or missing: {mihomo_bin}"); sys.exit(1)
              
              # start a temporary mihomo with all proxies
              cfg = {
                  "mixed-port": 17890,
                  "external-controller": "127.0.0.1:19090",
                  "log-level": "warning",
                  "proxies": proxies,
                  "proxy-groups": [{"name": "SEL", "type": "select", "proxies": [p["name"] for p in proxies]}],
                  "rules": ["MATCH,SEL"]
              }
              import tempfile, json as _json
              with tempfile.TemporaryDirectory() as td:
                  cfg_path = os.path.join(td, "cfg.yaml")
                  with open(cfg_path, "w") as f: _json.dump(cfg, f)
                  proc = subprocess.Popen([mihomo_bin, "-d", td, "-f", cfg_path],
                                          stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  time.sleep(3)
                  try:
                      # test each proxy via REST API
                      alive = []
                      def test_one(name):
                          try:
                              url = f"http://127.0.0.1:19090/proxies/{urllib.parse.quote(name)}/delay?timeout=5000&url=http://cp.cloudflare.com/generate_204"
                              req = urllib.request.Request(url, headers={"User-Agent": "test"})
                              with urllib.request.urlopen(req, timeout=10) as r:
                                  d = json.load(r)
                                  delay = d.get("delay")
                                  if delay and delay > 0:
                                      return (name, delay)
                          except Exception:
                              pass
                          return None
                      names = [p["name"] for p in proxies]
                      with cf.ThreadPoolExecutor(50) as ex:
                          results = list(ex.map(test_one, names))
                      alive = [r for r in results if r]
                      print(f"alive {len(alive)}/{len(proxies)}")
                      alive_names = {r[0] for r in alive}
                      # filter proxies
                      alive_proxies = [p for p in proxies if p["name"] in alive_names]
                      # write filtered
                      for f in glob.glob("output/*.yaml") + glob.glob("output/*.yml"):
                          d = load_yaml(f)
                          if d is None: d = parse_clash(f)
                          if d and d.get("proxies"):
                              d["proxies"] = [p for p in d["proxies"] if p["name"] in alive_names]
                              import yaml
                              with open(f, "w") as fh:
                                  yaml.dump(d, fh, allow_unicode=True, sort_keys=False)
                      print(f"filtered: {len(proxies)} -> {len(alive_proxies)}")
              main()
          PY

      - name: Enrich + grade -> nodes.json
        run: |
          python3 -m pip install -q pyyaml 2>/dev/null || pip install -q pyyaml
          python3 enrich.py

      - name: Commit results
        run: |
          set -e
          git config user.name "node-bot"; git config user.email "bot@localhost"
          git add nodes.json top10.yaml 2>/dev/null || true
          git commit -q -m "auto update $(date -u +%F\ %R)UTC" || echo "no change"
          # remote may have moved on (config edits, previous run) -> rebase before push
          for i in 1 2 3; do
            git pull --rebase --autostash -q origin main || true
            if git push -q origin HEAD:main; then echo pushed; break; fi
            echo "push retry $i"; sleep 5
          done
          wc -c nodes.json top10.yaml 2>/dev/null || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nodes-run
          path: output/
          retention-days: 3
          if-no-files-found: ignore
