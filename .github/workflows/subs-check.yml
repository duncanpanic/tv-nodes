name: subs-check

# 每 6 小时抓一轮公开免费节点，产出 nodes.json + top10.yaml 给 3D 地球小站用。
# 注意：这个文件本身是 YAML，里面不要再写"未缩进的 heredoc"（会直接把整个
# workflow 变成语法错误，Actions 会 0 秒失败）。所有配置都放仓库根目录的
# config.yaml，单一事实来源。

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# 同一时间只跑一轮，避免两次运行互抢 commit
concurrency:
  group: subs-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOK: ${{ secrets.GITHUB_TOKEN }}
      FALLBACK_VER: v1.6.5
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Download subs-check
        run: |
          set -e
          REL=$(curl -s -H "Authorization: Bearer $GH_TOK" https://api.github.com/repos/beck-8/subs-check/releases/latest)
          VER=$(echo "$REL" | jq -r '.tag_name // empty')
          ASSET=$(echo "$REL" | jq -r '.assets[]? | select(.name|test("Linux_x86_64\\.tar\\.gz")) | .browser_download_url' | head -1)
          if [ -z "$ASSET" ] || [ "$ASSET" = "null" ]; then
            ASSET="https://github.com/beck-8/subs-check/releases/download/${VER:-$FALLBACK_VER}/subs-check_Linux_x86_64.tar.gz"
          fi
          echo "version=$VER asset=$ASSET"
          curl -sSL --retry 3 -o sc.tar.gz "$ASSET"
          tar xzf sc.tar.gz
          BIN=$(find . -path ./.github -prune -o -type f -name 'subs-check' -print | head -1)
          chmod +x "$BIN"
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Download mihomo core
        run: |
          set -e
          REL=$(curl -s -H "Authorization: Bearer $GH_TOK" https://api.github.com/repos/MetaCubeX/mihomo/releases/latest)
          VER=$(echo "$REL" | jq -r '.tag_name // empty')
          NAME=$(echo "$REL" | jq -r --arg b "mihomo-linux-amd64-v1" '.assets[]?.name | select(test("^" + $b + "-v.*\\.gz$"))' | head -1)
          if [ -z "$NAME" ] || [ "$NAME" = "null" ]; then
            VER=${VER:-v1.19.34}
            NAME="mihomo-linux-amd64-v1-v${VER}.gz"
          fi
          ASSET="https://github.com/MetaCubeX/mihomo/releases/download/${VER}/${NAME}"
          echo "mihomo version=$VER asset=$ASSET"
          curl -sSL --retry 3 -o mihomo.gz "$ASSET"
          gunzip -c mihomo.gz > mihomo
          chmod +x mihomo
          echo "MIHOMO_BIN=$PWD/mihomo" >> "$GITHUB_ENV"

      - name: Runner network sanity check
        run: |
          echo "runner ip: $(curl -s --max-time 8 http://ip-api.com/json/ | head -c 200)"
          for u in http://gstatic.com/generate_204 http://cp.cloudflare.com/generate_204; do
            printf '%s -> %s\n' "$u" "$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 "$u")"
          done

      - name: Run subs-check one round
        run: |
          rm -rf output
          "$BIN" -f config.yaml > sc.log 2>&1 &
          PID=$!; DONE=0
          for i in $(seq 1 290); do
            sleep 10
            if grep -qE "检测完成" sc.log; then DONE=1; echo "done in ~$((i*10))s"; break; fi
            if ! kill -0 $PID 2>/dev/null; then DONE=1; echo "exited"; break; fi
          done
          [ "$DONE" = "0" ] && echo "timeout, force stop"
          sleep 8; kill $PID 2>/dev/null || true
          grep -E "合并去重后节点数量|存活节点数量|流媒体检测通过|可用节点数量|消耗流量" sc.log | tail -20 || true
          grep -iE "level=FATAL|level=ERROR" sc.log | tail -8 || true
          ls -la output/ 2>/dev/null || true
          if [ ! -s output/all.yaml ]; then
            echo "::error::subs-check produced no output/all.yaml"
            tail -60 sc.log
            exit 1
          fi

      # 说明：曾经在这里插过 test_connectivity.py（用 mihomo REST API 再筛一道），
      # 它把 1051 个已经过 subs-check 真拨号验证的节点判成 0 个存活并覆盖了
      # output/all.yaml，导致 nodes.json 变成空数据。当前流程不再使用它。
      - name: Enrich + grade -> nodes.json
        run: |
          python3 -m pip install -q --break-system-packages pyyaml 2>/dev/null \
            || python3 -m pip install -q pyyaml 2>/dev/null || true
          python3 -c "import yaml" 2>/dev/null && echo "pyyaml: yes" || echo "pyyaml: no (fallback parser)"
          python3 enrich.py

      - name: Commit results
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d = json.load(open("nodes.json", encoding="utf-8"))
          assert d.get("top10"), "top10 is empty"
          blob = open("nodes.json", encoding="utf-8").read()
          assert "<<<<<<<" not in blob and ">>>>>>>" not in blob, "conflict markers in nodes.json"
          print("nodes.json ok: top10=%d strict=%d scanned=%d" % (
              len(d["top10"]), d.get("strict_count", 0), d.get("source_count", 0)))
          PY
          # all.yaml 是全量候选节点池，提交回仓库供国内网关拉取做直连过滤
          cp output/all.yaml all.yaml
          git config user.name "node-bot"
          git config user.email "bot@localhost"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            # 把我们的数据变更重放到最新 origin/main 之上：永远不会产生 merge 冲突
            git reset -q --soft FETCH_HEAD
            git add nodes.json top10.yaml all.yaml
            if git diff --cached --quiet; then
              echo "no change"
              exit 0
            fi
            git commit -q -m "auto update $(date -u +%FT%TZ)"
            if git push -q origin HEAD:main; then
              echo "pushed"
              exit 0
            fi
            echo "push retry $i"
            sleep 5
          done
          echo "::error::push failed after 5 retries"
          exit 1

      - name: Purge jsDelivr cache
        if: always()
        run: |
          for f in nodes.json top10.yaml; do
            printf '%s: %s\n' "$f" \
              "$(curl -s --max-time 20 "https://purge.jsdelivr.net/gh/duncanpanic/tv-nodes@main/$f" | head -c 160)"
          done

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nodes-run
          path: |
            output/
            nodes.json
            top10.yaml
          retention-days: 3
          if-no-files-found: ignore
